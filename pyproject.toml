[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "probability"
version = "0.1.0"
description = "简单概率与随机实验：硬币、骰子、摸球、转盘概率计算与练习纸生成"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "eastyou" }]
keywords = ["education", "math", "probability", "python", "teaching"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
probability = "probability.cli:main"

[tool.setuptools]
packages = ["probability"]
